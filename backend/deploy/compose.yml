services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: salon
      POSTGRES_USER: salon_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set an independent database owner password}
    volumes:
      - salon-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon_owner -d salon"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  api:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    env_file: ${BACKEND_ENV_FILE:?Set the absolute path of the private backend environment file}
    environment:
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  worker:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    env_file: ${BACKEND_ENV_FILE:?Set the private backend environment file}
    command: ["node", "--enable-source-maps", "dist/backend/src/worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  salon-data:
